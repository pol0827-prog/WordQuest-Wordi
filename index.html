<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>어휘 놀이터 · 수능 국어</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{--bg1:#d6ecc2;--bg2:#a9d58b;--c:#fffdf5;--t:#1f2420;--m:#5d665a;--ln:#1f2420;--red:#e5252a;--cr:#f6e7c1;--ok:#2a9d4a;--no:#d62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#233a24;--bg2:#162417;--c:#2a3128;--t:#f3f1e6;--m:#b4bdae;--ln:#0b120c;--cr:#3a4236;--ok:#5fd17f;--no:#ff7a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#233a24;--bg2:#162417;--c:#2a3128;--t:#f3f1e6;--m:#b4bdae;--ln:#0b120c;--cr:#3a4236;--ok:#5fd17f;--no:#ff7a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:linear-gradient(var(--bg1),var(--bg2)) fixed;color:var(--t);font:16px/1.6 Jua,"Noto Sans KR","Malgun Gothic",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg1)}
.w{max-width:560px;margin:0 auto;padding:6px 14px 100px}.wide{max-width:760px}
h1{font-size:24px;margin:4px 0}.sm{font-size:13px;color:var(--m)}
.card{background:var(--c);border:3px solid var(--ln);border-radius:18px;box-shadow:4px 4px 0 var(--ln);padding:14px;margin:14px 0}
.b{font:inherit;cursor:pointer;color:var(--t);background:var(--cr);border:3px solid var(--ln);border-radius:14px;padding:9px 13px;box-shadow:3px 3px 0 var(--ln)}
.b:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ln)}.b:disabled{opacity:.45}
.r{background:var(--red);color:#fff}.bb{display:block;width:100%;margin:10px 0}.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.top{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg1);padding:8px 0}.top .b{flex:1;padding:7px 4px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px}
.hero{width:100%;border:3px solid var(--ln);border-radius:18px;box-shadow:4px 4px 0 var(--ln);display:block;margin-top:10px}
.say{display:flex;gap:10px;align-items:flex-end;margin:10px 0}.say img{width:72px;height:72px;flex:none;border-radius:50%;border:3px solid var(--ln);object-fit:cover;background:#fff}
.bub{background:#fff;color:#1f2420;border:3px solid var(--ln);border-radius:16px;padding:10px 12px}
.hd{display:block;margin:16px 0 0;font-size:19px}.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}.sc{position:relative;text-align:center;padding:14px 4px;font-size:18px}
.sc>div:first-child{font-size:28px}.sc.rec{background:#fff1a6;color:#1f2420;animation:gl 1s infinite alternate}
@keyframes gl{to{box-shadow:3px 3px 0 var(--ln),0 0 0 5px #e5252a66}}
.arr{position:absolute;top:-26px;left:50%;font-size:26px;animation:bob .7s infinite alternate}@keyframes bob{from{transform:translate(-50%,0)}to{transform:translate(-50%,8px)}}
.chip{padding:5px 10px;margin:3px 3px 0 0;font-size:14px}.chip.on{background:var(--red);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:9px 0}.opt.sel{background:#ffe9a8;color:#1f2420}.opt.ok{background:#c6f0cf;color:#1f2420}.opt.no{background:#ffd0d0;color:#1f2420}
.big{font-size:32px;text-align:center;margin:8px 0}.big2{font-size:18px;margin:8px 0 12px}
.prog{height:12px;border:2px solid var(--ln);border-radius:8px;background:#fff;margin:6px 0 10px;overflow:hidden}.prog i{display:block;height:100%;background:var(--red)}
#fb,#tip{margin-top:8px;font-size:15px}.ps{line-height:2.1}
mark{background:#ffe27a;color:#1f2420;border-radius:4px;padding:0 3px;cursor:pointer}
select{font:inherit;border:2px solid var(--ln);border-radius:8px;background:var(--c);color:var(--t);max-width:9em}select.ok{border-color:var(--ok)}select.no{border-color:var(--no)}
input,textarea{font:inherit;width:100%;box-sizing:border-box;margin:6px 0;padding:9px;border:3px solid var(--ln);border-radius:12px;background:#fff;color:#1f2420}textarea{height:80px}
#act{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:3px solid var(--ln)}#act .b{padding:8px 10px;font-size:14px}
.stats{display:flex;gap:8px;margin:12px 0}.stats div{flex:1;background:var(--cr);border:3px solid var(--ln);border-radius:14px;padding:8px;font-size:13px}.stats b{font-size:22px}
.mod{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:20;padding:20px}.mod .card{width:100%;max-width:340px}
.tt{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1f2420;color:#fff;padding:8px 14px;border-radius:12px;z-index:30}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px;border-bottom:2px solid var(--ln);text-align:left;white-space:nowrap}tr[data-id]{cursor:pointer}
summary{cursor:pointer}
</style></head><body><div id="app"></div>
